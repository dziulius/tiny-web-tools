<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maži interneto įrankiai</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #29233b; background: #f2efe7; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(680px, calc(100% - 32px)); }
    h1 { margin-bottom: 8px; font-family: Georgia, serif; }
    p { color: #716b80; }
    a { display: block; margin-top: 24px; padding: 20px; color: inherit; background: #fffefb; border: 1px solid #d8d2c5; border-radius: 12px; text-decoration: none; }
    a:hover { border-color: #7148c7; }
    strong { display: block; color: #49307e; font-size: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>Maži interneto įrankiai</h1>
    <p>Savarankiškos programėlės, veikiančios tiesiai naršyklėje.</p>
    <a href="kom_logo/"><strong>Komenskio Logo</strong>Vėžliuko programavimo dirbtuvė</a>
  </main>
</body>
</html>
